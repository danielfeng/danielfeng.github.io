# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Daniel's Blog
subtitle:
description: Daniel 的技术与工具笔记，记录平时折腾和用过的东西。
keywords: 技术, 工具, 笔记, Hexo
author: danielfeng
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://danielfeng.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - googlefe05ffc3f1a9b3d6.html   # Google Search Console verification file, served verbatim

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
updated_option: date
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: redefine

# Deployment
## Deployed by GitHub Actions (.github/workflows/deploy.yml) on push to the
## `source` branch; generated files are pushed to `master`.

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20

# Local search index for the Redefine navbar search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Sitemap (hexo-generator-sitemap); URLs come from `url` above
sitemap:
  path: sitemap.xml
  rel: false
  tags: false
  categories: false

# SEO extras, emitted by scripts/seo.js. Leave a value empty to emit nothing.
seo:
  default_image: /images/og-default.jpg   # 1200x630; a post can override with front-matter `og_image:`
  google_site_verification: ''  # Google Search Console "HTML tag" content value
  bing_site_verification: ''    # Bing Webmaster "msvalidate.01" content value
  goatcounter_code: 'danielfeng'          # e.g. `danielfeng` for https://danielfeng.goatcounter.com (analytics off while empty)
